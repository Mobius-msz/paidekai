name: 打包安卓 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备网页目录
        run: |
          mkdir -p www
          cp index.html app.js styles.css author.jpg www/
          cp widget.html widget.js widget.css www/
          cp manifest.webmanifest sw.js www/
          cp icon-192.png icon-512.png icon-maskable.png apple-touch-icon.png www/
          ls -la www

      - name: 安装 Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: 初始化并生成安卓工程
        run: |
          npx cap init "排得开" app.paidekai --web-dir=www
          npx cap add android
          npx cap sync android

      - name: 生成安卓图标
        run: |
          npm i -D @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#0D1017' --iconBackgroundColorDark '#0D1017' || echo '图标生成跳过'

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: paidekai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
