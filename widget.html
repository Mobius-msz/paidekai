<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>撞不上 · 桌面挂件</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('zhuangbushang.theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="stylesheet" href="widget.css?v=20261120L">
</head>
<body>
<div class="wg" id="app"></div>
<script src="widget.js?v=20261120L"></script>
</body>
</html>
