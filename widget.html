<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排得开 · 桌面挂件</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('paidekai.theme');
      if (t !== 'dark' && t !== 'light') {
        t = 'dark';   // 默认深色
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="stylesheet" href="widget.css?v=20261121a2">
</head>
<body>
<div class="wg" id="app"></div>
<script src="widget.js?v=20261121a2"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
